
name: ARA Vendor BR
on:
  schedule:
    - cron: '5 * * * *'      # hora a hora (UTC)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
      - name: Configure .env
        run: |
          cp config/.env.sample config/.env
          sed -i "s|LWA_CLIENT_ID=|LWA_CLIENT_ID=${{ secrets.LWA_CLIENT_ID }}|" config/.env
          sed -i "s|LWA_CLIENT_SECRET=|LWA_CLIENT_SECRET=${{ secrets.LWA_CLIENT_SECRET }}|" config/.env
          sed -i "s|LWA_REFRESH_TOKEN=|LWA_REFRESH_TOKEN=${{ secrets.LWA_REFRESH_TOKEN }}|" config/.env
          sed -i "s|AWS_ACCESS_KEY_ID=|AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}|" config/.env
          sed -i "s|AWS_SECRET_ACCESS_KEY=|AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}|" config/.env
          sed -i "s|AZURE_BLOB_CONNECTION_STRING=|AZURE_BLOB_CONNECTION_STRING=${{ secrets.AZURE_BLOB_CONNECTION_STRING }}|" config/.env
          sed -i "s|AZURE_BLOB_CONTAINER=|AZURE_BLOB_CONTAINER=${{ secrets.AZURE_BLOB_CONTAINER }}|" config/.env
      - name: Run collector
        run: |
          python src/spapi_vendor_br.py
